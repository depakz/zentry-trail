version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:3.8
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - '2181:2181'
    healthcheck:
      test: ['CMD', 'echo', 'ruok', '|', 'grep', 'imok']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - '9092:9092'
    depends_on:
      - zookeeper
    healthcheck:
      test: ['CMD-SHELL', "</dev/tcp/localhost/9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: timescale/timescaledb:latest-pg14
    environment:
      - POSTGRES_USER=avvp
      - POSTGRES_PASSWORD=avvp
      - POSTGRES_DB=avvp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avvp']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: vault:1.13
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
    command: server -dev -dev-root-token-id=root
    ports:
      - '8200:8200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sSf http://localhost:8200/v1/sys/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 8

  jaeger:
    image: jaegertracing/all-in-one:1.48
    ports:
      - '16686:16686'
      - '14250:14250'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:16686 >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: prom/prometheus:latest
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9090/metrics >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/test
    ports:
      - '7474:7474'
      - '7687:7687'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:7474/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    name: avvp-net

volumes:
  pgdata:
  miniodata:
