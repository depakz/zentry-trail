id: avvp-ssrf-ssrf-metadata-58
info:
  name: Metadata SSRF Probe
  severity: high
  tags:
  - ssrf
  - cloud
  author: avvp
  description: Metadata SSRF Probe nuclei-style detection template.
metadata:
  category: ssrf
  template_type: detection
  source: avvp
requests:
- method: GET
  path:
  - /fetch?url=http://169.254.169.254/latest/meta-data/
  matchers:
  - type: word
    words:
    - ami-id
    - instance-id
    part: body
