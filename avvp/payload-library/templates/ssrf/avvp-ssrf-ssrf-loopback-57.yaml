id: avvp-ssrf-ssrf-loopback-57
info:
  name: Loopback SSRF Probe
  severity: high
  tags:
  - ssrf
  - loopback
  author: avvp
  description: Loopback SSRF Probe nuclei-style detection template.
metadata:
  category: ssrf
  template_type: detection
  source: avvp
requests:
- method: GET
  path:
  - /fetch?url=http://127.0.0.1/
  matchers:
  - type: word
    words:
    - connection refused
    - localhost
    part: body
