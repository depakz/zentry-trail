id: avvp-jwt-jwt-fixation-20
info:
  name: JWT Fixation Probe
  severity: medium
  tags:
  - jwt
  - session
  author: avvp
  description: JWT Fixation Probe nuclei-style detection template.
metadata:
  category: jwt
  template_type: detection
  source: avvp
requests:
- method: GET
  path:
  - /api/session
  matchers:
  - type: word
    words:
    - session
    - authorized
    part: body
  headers:
    Authorization: Bearer {{JWT}}
