id: avvp-xss-xss-dom-24
info:
  name: DOM XSS Probe
  severity: medium
  tags:
  - xss
  - dom
  author: avvp
  description: DOM XSS Probe nuclei-style detection template.
metadata:
  category: xss
  template_type: detection
  source: avvp
requests:
- method: GET
  path:
  - /search#<img src=x onerror=alert(1)>
  matchers:
  - type: word
    words:
    - onerror
    - alert(1)
    part: body
